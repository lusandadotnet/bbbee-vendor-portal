_schema-version: 3.3.0
ID: b-bbee-vendor-portal
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: b-bbee-vendor-portal-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: b-bbee-vendor-portal-auth
      - name: b-bbee-vendor-portal-db
      - name: b-bbee-vendor-portal-destination
      - name: b-bbee-vendor-portal-connectivity # <-- ADDED: Allows Cloud SDK to tunnel securely

  - name: b-bbee-vendor-portal-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: b-bbee-vendor-portal-db

resources:
  - name: b-bbee-vendor-portal-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: b-bbee-vendor-portal-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
        role-collections:
          - name: 'ComplianceOfficer (b-bbee-vendor-portal ${org}-${space})'
            description: 'generated'
            role-template-references:
              - '$XSAPPNAME.ComplianceOfficer'
              
  - name: b-bbee-vendor-portal-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
      
  - name: b-bbee-vendor-portal-destination
    type: org.cloudfoundry.managed-service
    parameters:
      service: destination
      service-plan: lite

  - name: b-bbee-vendor-portal-connectivity
    type: org.cloudfoundry.managed-service
    parameters:
      service: connectivity
      service-plan: lite